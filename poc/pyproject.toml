[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandpoc"
version = "0.1.0"
description = "Model comparison harness for band-rehearsal music segment detection"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "yt-dlp>=2024.1.1",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# torchaudio: the silero-vad hub repo imports it unconditionally.
torch = ["torch>=2.1", "torchaudio>=2.1", "panns-inference>=0.1.1"]
# transformers 5 renamed the CLAP processor audio kwarg and wrapped the
# feature getters in output objects; the adapters use that API.
hf = ["torch>=2.1", "transformers>=5.0"]
tf = ["tensorflow-cpu>=2.13,<2.17", "tensorflow-hub>=0.15", "inaSpeechSegmenter>=0.7.7"]

[project.scripts]
bandpoc = "bandpoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
